Parameters:
  GitHubOrgUser:
    Description: Name of GitHub organization/user (case sensitive)
    Type: String
  RepositoryName:
    Description: Name of GitHub repository (case sensitive)
    Type: String
  OIDCAudience:
    Description: Audience supplied to configure-aws-credentials.
    Default: "sts.amazonaws.com"
    Type: String
Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated:
                - !Ref GithubOidc
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: !Ref OIDCAudience
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrgUser}/${RepositoryName}:*
  DeployRolePolicies:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "root"
      PolicyDocument:
        Version: "2012-10-17"
        Statement: [
          {"Effect":"Allow","Action":["iam:GetRole","iam:PassRole","iam:DeleteRole","iam:PutRolePolicy","iam:DeleteRolePolicy","iam:CreateRole","iam:CreateServiceLinkedRole","iam:AttachRolePolicy","iam:DetachRolePolicy","iam:UpdateAssumeRolePolicy","iam:RemoveRoleFromInstanceProfile","iam:RemoveRoleFromInstanceProfile","iam:AddRoleToInstanceProfile","iam:DeleteInstanceProfile","iam:CreateInstanceProfile","iam:UpdateInstanceProfile","iam:TagRole","iam:UntagRole"],"Resource":"arn:aws:iam::${AWS::AccountId}:role/*"},
          {"Effect":"Allow","Action":["iam:*"],"Resource":"arn:aws:iam::${AWS::AccountId}:instance-profile/*"},
          {"Effect":"Allow","Action":["*"],"Resource":"arn:aws:iam::${AWS::AccountId}:group/*"},
          {"Effect":"Allow","Action":["ecr:*"],"Resource":"*"},
          {"Effect":"Allow","Action":["ecs:*"],"Resource":"*"},
          {"Effect":"Allow","Action":["logs:*"],"Resource":"*"},
          {"Effect":"Allow","Action":["elasticloadbalancing:*"],"Resource":"*"},
          {"Effect":"Allow","Action":["sns:*"],"Resource":"*"},
          {"Effect":"Allow","Action":["ec2:*"],"Resource":"*"},
          {"Effect":"Allow","Action":["ssm:*"],"Resource":"*"},
          {"Effect":"Allow","Action":["sqs:*"],"Resource":"*"},
          {"Effect":"Allow","Action":["autoscaling:*"],"Resource":"*"},
          {"Effect":"Allow","Action":["s3:*"],"Resource":"*"},
          {"Effect":"Allow","Action":["ses:*"],"Resource":"*"}
        ]
        
      Roles:
        - Ref: "DeployRole"
  GithubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
Outputs:
  Role:
    Value: !GetAtt Role.Arn
