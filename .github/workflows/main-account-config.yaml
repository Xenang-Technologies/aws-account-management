name: Test CI Workflow

on:
  push:
    branches: [ "main" ]

# Necessary permissions for workflow
permissions:
  id-token: write
  contents: read

jobs:
  ConfigureMainAccount:
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      # Install awscli
      - uses: unfor19/install-aws-cli-action@v1
      
      # Assume the OIDC Role to get temporary credentials 
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::842675981834:role/deploy
  
      # Print current loged in user
      - name: Print username
        run: |
          cf_template_file='./account-configuration/main-account.yaml'
          stack_name='main-account-configuration'

          aws sts get-caller-identity
          
          aws cloudformation deploy \
            --template-file "$cf_template_file" \
            --stack-name "$stack_name"  \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_NAMED_IAM
