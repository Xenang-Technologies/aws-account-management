Resources:
  AdminGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: admins
      Policies:
        - PolicyName: AssumeRoleintoEnvironments
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource: 
                  - 'arn:aws:iam::*:role/admin'
                  - 'arn:aws:iam::*:role/deploy'
                  - 'arn:aws:iam::*:role/ci'
                  - 'arn:aws:iam::*:role/dev'
                  - 'arn:aws:iam::*:role/trainee'

  DevGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: devs
      Policies:
        - PolicyName: AssumeRoleIntoEnvironments
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource: 
                  - 'arn:aws:iam::*:role/dev'
                  - 'arn:aws:iam::*:role/trainee'
                  - 'arn:aws:iam::*:role/deploy'

  TraineeGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: trainees
      Policies:
        - PolicyName: AssumeRoleIntoEnvironments
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource: 
                  - 'arn:aws:iam::*:role/trainee'


  FinanceGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: finance
      Policies:
        - PolicyName: AssumeRoleIntoEnvironments
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource: 
                  - 'arn:aws:iam::*:role/billing'

## Admins Users
  Ryan:
    Type: AWS::IAM::User
