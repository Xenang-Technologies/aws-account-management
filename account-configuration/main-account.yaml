Resources:
  AdminGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: admins
      Policies:
        - PolicyName: AssumeRoleintoEnvironments
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource: 
                  - 'arn:aws:iam::*:role/admin'
                  - 'arn:aws:iam::*:role/deploy'
                  - 'arn:aws:iam::*:role/ci'

  DevGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: devs
      Policies:
        - PolicyName: AssumeRoleIntoEnvironments
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource: 
                  - 'arn:aws:iam::*:role/dev'
                  - 'arn:aws:iam::*:role/deploy'

## Admins Users
  Ryan:
    Type: AWS::IAM::User
    Properties:
      UserName: ryan
      Groups:
        - !Ref AdminGroup
        - !Ref DevGroup
  ## Devs Users
  Cedrick:
    Type: AWS::IAM::User
    Properties:
      UserName: cedrick
      Groups:
        - !Ref DevGroup
  Carlson:
    Type: AWS::IAM::User
    Properties:
      UserName: carlson
      Groups:
        - !Ref DevGroup
  Desmond:
