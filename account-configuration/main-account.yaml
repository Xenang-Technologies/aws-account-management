Resources:
  AdminGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: admins

  AdminAssumeRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allow admins to assume roles into environment accounts
      Groups:
        - !Ref AdminGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: 'sts:AssumeRole'
            Resource:
              - 'arn:aws:iam::*:role/admin'
              - 'arn:aws:iam::*:role/deploy'
              - 'arn:aws:iam::*:role/ci'
              - 'arn:aws:iam::*:role/dev'

  DevGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: devs

  DevAssumeRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allow devs to assume roles into environment accounts
      Groups:
        - !Ref DevGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: 'sts:AssumeRole'
            Resource:
              - 'arn:aws:iam::*:role/dev'
              - 'arn:aws:iam::*:role/trainee'
              - 'arn:aws:iam::*:role/deploy'

  FinanceGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: finance

  FinanceAssumeRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allow finance to assume the billing role in environment accounts
      Groups:
        - !Ref FinanceGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: 'sts:AssumeRole'
            Resource:
              - 'arn:aws:iam::*:role/billing'

## Admins Users
  Lovette:
    Type: AWS::IAM::User
    Properties:
      UserName: lovette
      Groups:
        - !Ref AdminGroup
        - !Ref DevGroup